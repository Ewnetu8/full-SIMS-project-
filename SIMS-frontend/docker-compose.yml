# ═══════════════════════════════════════════════════════════════════════════════
# ExamSphere — AI-Powered Examination & Grading System
# docker-compose.yml — Frontend Development Orchestration
# ═══════════════════════════════════════════════════════════════════════════════
#
# Usage:
#   Development (hot reload):  docker compose up
#   Production simulation:     docker compose --profile prod up
#   Stop everything:           docker compose down
#   View logs:                 docker compose logs -f frontend
#
# Note: This compose file is intentionally frontend-only. When the Django
#       backend is ready, add it as a separate service in a top-level
#       docker-compose.yml at the project root.
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ── Development Service ──────────────────────────────────────────────────────
  # Default profile — started with plain `docker compose up`.
  # Hot reload is enabled via the bind mount on `./src` and the named volume
  # for node_modules (prevents host/container platform conflicts).
  # ──────────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: examsphere-frontend-dev

    ports:
      # Map host port 3000 → container port 3000.
      # Access the app at http://localhost:3000
      - "3000:3000"

    volumes:
      # ── Source bind-mounts ──────────────────────────────────────────────────
      # Mount the entire project root so that ANY file change on the host
      # (src/, public/, next.config.ts, tailwind config, etc.) is immediately
      # visible inside the container — enabling true hot reload.
      - .:/app

      # ── node_modules isolation ──────────────────────────────────────────────
      # IMPORTANT: This named volume shadows the host's node_modules directory.
      # Rationale:
      #   1. Performance — host filesystems (especially on Windows/macOS with
      #      Docker Desktop) are slow for thousands of small files like
      #      node_modules. A named volume is managed natively by Docker and is
      #      ~10x faster.
      #   2. Correctness — native addons are compiled for the container OS
      #      (Linux). Mounting host node_modules (compiled for Windows/macOS)
      #      would break them.
      - frontend_node_modules:/app/node_modules

      # ── .next cache isolation ───────────────────────────────────────────────
      # Similarly isolate the Next.js build cache to avoid cross-platform
      # cache corruption and speed up incremental builds.
      - frontend_next_cache:/app/.next

    environment:
      # Node environment — controls Next.js dev mode (HMR, detailed errors)
      - NODE_ENV=development

      # Tell Next.js to poll for file changes (needed on Windows/WSL2 where
      # inotify-based watching is unreliable across filesystem boundaries).
      - WATCHPACK_POLLING=true

      # Suppress telemetry
      - NEXT_TELEMETRY_DISABLED=1

      # API URL — override this to point at your local Django backend.
      # Must be reachable from the BROWSER, not the container, since
      # NEXT_PUBLIC_* variables are inlined into client-side JavaScript.
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-ExamSphere}

    # Restart the container automatically if it crashes (e.g., due to a
    # syntax error that kills the dev server). `unless-stopped` means it
    # will restart on failure but NOT when you manually run `docker compose down`.
    restart: unless-stopped

    # Docker health check — polls the Next.js health endpoint every 30 s.
    # The container is marked "healthy" once the server responds with HTTP 200.
    # Other services (e.g., an e2e test runner) can depend on this.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Production Simulation Service ────────────────────────────────────────────
  # Activated with: docker compose --profile prod up frontend-prod
  # Builds the production image locally and serves it on port 3001 so you
  # can verify the production build without hitting the dev server.
  # ──────────────────────────────────────────────────────────────────────────────
  frontend-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-ExamSphere}
    container_name: examsphere-frontend-prod
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s


# ── Named Volumes ─────────────────────────────────────────────────────────────
# These volumes persist across `docker compose down` (but not `down -v`).
# They are managed by Docker and stored on the host's Docker data directory,
# not the project filesystem.
# ──────────────────────────────────────────────────────────────────────────────
volumes:
  # Stores node_modules inside the container's virtual filesystem for
  # performance and cross-platform compatibility.
  frontend_node_modules:
    name: examsphere_frontend_node_modules

  # Stores the Next.js incremental compilation cache (.next/) to speed up
  # repeated builds during development.
  frontend_next_cache:
    name: examsphere_frontend_next_cache
